name: Build Android CLAP

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
      - name: Install NDK
        run: sdkmanager "ndk;26.3.11579264"
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release -j2
      - name: Package
        run: |
          mkdir -p artifact
          find build -name "natural_female.clap" -exec cp {} artifact/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: natural-female-arm64
          path: artifact/natural_female.clap
